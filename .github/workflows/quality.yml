name: Quality

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: host/**/packages.lock.json
      - run: dotnet restore .\host\Jarvis.Host.sln --locked-mode
      - run: dotnet build .\host\Jarvis.Host.sln -c Release --no-restore
      - run: dotnet test .\host\Jarvis.Host.sln -c Release --no-build
      - run: git diff --check
